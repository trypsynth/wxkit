name: CI

# A tag such as v0.1.0-preview.1 runs everything a push does, and then publishes the packages it
# made, with the tag's version.
on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

# A newer push to a pull request makes an older run moot, so only the newest runs. On master, a
# run is left to finish, and newer pushes wait for it, since a cold wxWidgets build takes longer
# than the gap between pushes and its cache is only saved once it ends.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Each runtime builds and tests on a machine of its own architecture, so its tests and its Native
  # AOT executable run as they would for a user.
  build:
    name: Build and test (${{ matrix.runtime }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # MSVC links libraries from an older toolset but not a newer one, so wxWidgets is built
          # with the oldest Visual Studio an application is likely to publish with.
          - runtime: win-x64
            runner: windows-2022
          - runtime: win-arm64
            runner: windows-11-arm
          # Linux builds on the oldest supported Ubuntu, so the packages work with its glibc and
          # anything newer.
          - runtime: linux-x64
            runner: ubuntu-22.04
          - runtime: linux-arm64
            runner: ubuntu-22.04-arm
          - runtime: osx-arm64
            runner: macos-15
          - runtime: osx-x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    # A cold wxWidgets build takes most of this. A hung test would otherwise hold the runner for hours.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # wxGTK builds against GTK 3, and its web view against WebKitGTK, and the tests and the smoke
      # test need a display, which Xvfb gives. gettext's msgfmt compiles wxWidgets' catalogs, on
      # every runner.
      - name: Install GTK 3, WebKitGTK, Xvfb, and gettext
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgtk-3-dev libwebkit2gtk-4.1-dev ninja-build xvfb gettext

      # Xcode, its clang, and a window server come with the runner.
      - name: Install CMake, Ninja, and gettext
        if: runner.os == 'macOS'
        run: brew install cmake ninja gettext

      # mlocati's static build of gettext, pinned by its hash, which runs on Arm64 Windows too.
      - name: Install gettext
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "gettext.zip"
          Invoke-WebRequest "https://github.com/mlocati/gettext-iconv-windows/releases/download/v1.0-v1.19/gettext1.0-iconv1.19-static-64.zip" -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne "2B999BC37B56FA052FF98578E9CB188152009F634E3A66AA8FF263A016E9C466") { throw "The gettext archive is not the one pinned." }
          $gettext = Join-Path $env:RUNNER_TEMP "gettext"
          Expand-Archive $archive $gettext
          Add-Content $env:GITHUB_PATH (Join-Path $gettext "bin")

      # The generator, the generated bindings, and the formatting are the same on every runtime, so
      # one runtime checks them.
      - name: Test the generator
        if: matrix.runtime == 'win-x64'
        run: dotnet test --project tests/WxKit.Generator.Tests -c Release

      # The build tasks' extractor and checks are the same on every runtime, but the tasks run on
      # each, so each tests them.
      - name: Test the build tasks
        run: dotnet test --project tests/WxKit.Build.Tests -c Release

      # The generated bindings are checked in, so they have to match what the script makes from the
      # pinned wxWidgets. This runs before the native build, so a stale binding fails in a minute.
      - name: Check the generated bindings are current
        if: matrix.runtime == 'win-x64'
        shell: pwsh
        run: |
          ./scripts/generate.ps1
          $changes = git status --porcelain -- native/shim src/WxKit
          if ($changes) {
            $changes
            git diff -- native/shim src/WxKit
            throw "The generated bindings are out of date. Run scripts/generate.ps1 and commit the result."
          }

      - name: Find the wxWidgets commit
        id: wx
        shell: pwsh
        run: echo "commit=$(git -C native/wxWidgets rev-parse HEAD)" >> $env:GITHUB_OUTPUT

      # The build folder is cached, so a change to the shim rebuilds only the shim. The key starts
      # with the runtime, the wxWidgets commit, and the build script, so a cache from another
      # runtime, another wxWidgets, or other build options is never restored.
      - name: Restore the native build
        id: native-cache
        uses: actions/cache/restore@v4
        with:
          path: artifacts/native-build/${{ matrix.runtime }}
          key: native-${{ matrix.runtime }}-${{ steps.wx.outputs.commit }}-${{ hashFiles('scripts/build-native.ps1') }}-${{ hashFiles('native/shim/**') }}
          restore-keys: native-${{ matrix.runtime }}-${{ steps.wx.outputs.commit }}-${{ hashFiles('scripts/build-native.ps1') }}-

      # A fresh checkout makes every source newer than the cached objects, so MSBuild would rebuild
      # wxWidgets from scratch. Its sources only change with its commit, which is in the cache key,
      # so dating them before any build lets MSBuild reuse the cached objects.
      - name: Date the wxWidgets sources
        shell: bash
        run: find native/wxWidgets -type f -not -path '*/.git/*' -exec touch -t 200001010000 {} +

      - name: Build wxWidgets and the shim
        shell: pwsh
        run: ./scripts/build-native.ps1 -Runtimes ${{ matrix.runtime }}

      # Saved as soon as the build is done, so a failing test does not throw the build away.
      - name: Save the native build
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: artifacts/native-build/${{ matrix.runtime }}
          key: ${{ steps.native-cache.outputs.cache-primary-key }}

      - name: Check formatting
        if: matrix.runtime == 'win-x64'
        run: dotnet format WxKit.slnx --verify-no-changes

      - name: Test
        shell: pwsh
        run: |
          if ($IsLinux) { xvfb-run -a dotnet test --project tests/WxKit.Tests -c Release } else { dotnet test --project tests/WxKit.Tests -c Release }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($IsLinux) { xvfb-run -a dotnet test --project tests/WxKit.FSharp.Tests -c Release } else { dotnet test --project tests/WxKit.FSharp.Tests -c Release }
          exit $LASTEXITCODE

      - name: Test Native AOT
        shell: pwsh
        run: |
          if ($IsLinux) { xvfb-run -a pwsh ./scripts/test-aot.ps1 -Runtime ${{ matrix.runtime }} } else { ./scripts/test-aot.ps1 -Runtime ${{ matrix.runtime }} }
          exit $LASTEXITCODE

      # The pack job gathers every runtime's build into one set of packages.
      - name: Upload the native build
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.runtime }}
          path: artifacts/native/${{ matrix.runtime }}
          retention-days: 1

  # The shim's own code, built with AddressSanitizer and UndefinedBehaviorSanitizer, runs the tests
  # on Linux, which fail on any memory error or undefined behavior the sanitizers report. It runs
  # beside the builds, with a wxWidgets build of its own, and a release waits for it.
  sanitizers:
    name: Test with sanitizers and clang-tidy (linux-x64)
    # It ships nothing, so it runs on a newer Ubuntu than the builds, whose clang-tidy is the one
    # scripts/check-tidy.ps1 is written against.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install GTK 3, WebKitGTK, Xvfb, and clang-tidy
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgtk-3-dev libwebkit2gtk-4.1-dev ninja-build xvfb clang-tidy

      - name: Find the wxWidgets commit
        id: wx
        shell: pwsh
        run: echo "commit=$(git -C native/wxWidgets rev-parse HEAD)" >> $env:GITHUB_OUTPUT

      - name: Restore the sanitized build
        id: sanitize-cache
        uses: actions/cache/restore@v4
        with:
          path: artifacts/native-build/linux-x64-sanitize
          key: sanitize-linux-x64-${{ steps.wx.outputs.commit }}-${{ hashFiles('scripts/test-sanitizers.ps1') }}-${{ hashFiles('native/shim/**') }}
          restore-keys: sanitize-linux-x64-${{ steps.wx.outputs.commit }}-${{ hashFiles('scripts/test-sanitizers.ps1') }}-

      - name: Date the wxWidgets sources
        run: find native/wxWidgets -type f -not -path '*/.git/*' -exec touch -t 200001010000 {} +

      - name: Test with sanitizers
        shell: pwsh
        run: |
          xvfb-run -a pwsh ./scripts/test-sanitizers.ps1
          exit $LASTEXITCODE

      - name: Check the shim with clang-tidy
        if: always()
        shell: pwsh
        run: ./scripts/check-tidy.ps1 -Build artifacts/native-build/linux-x64-sanitize

      - name: Save the sanitized build
        if: always() && steps.sanitize-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: artifacts/native-build/linux-x64-sanitize
          key: ${{ steps.sanitize-cache.outputs.cache-primary-key }}

  pack:
    needs: build
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      # The native packages carry the license texts of wxWidgets and its bundled libraries, which
      # are in its submodules.
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Download the win-x64 build
        uses: actions/download-artifact@v4
        with:
          name: native-win-x64
          path: artifacts/native/win-x64

      - name: Download the win-arm64 build
        uses: actions/download-artifact@v4
        with:
          name: native-win-arm64
          path: artifacts/native/win-arm64

      - name: Download the linux-x64 build
        uses: actions/download-artifact@v4
        with:
          name: native-linux-x64
          path: artifacts/native/linux-x64

      - name: Download the linux-arm64 build
        uses: actions/download-artifact@v4
        with:
          name: native-linux-arm64
          path: artifacts/native/linux-arm64

      - name: Download the osx-arm64 build
        uses: actions/download-artifact@v4
        with:
          name: native-osx-arm64
          path: artifacts/native/osx-arm64

      - name: Download the osx-x64 build
        uses: actions/download-artifact@v4
        with:
          name: native-osx-x64
          path: artifacts/native/osx-x64

      # A tag names the version, as v0.1.0-preview.1 does. Anything else packs the version in
      # Directory.Build.props.
      - name: Pack
        shell: pwsh
        run: |
          $version = $null
          if ($env:GITHUB_REF -like "refs/tags/v*") {
            $version = $env:GITHUB_REF.Substring("refs/tags/v".Length)
            if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') { throw "The tag v$version is not a version, such as v0.1.0 or v0.1.0-preview.1." }
          }
          ./scripts/pack.ps1 -Runtimes win-x64, win-arm64, linux-x64, linux-arm64, osx-arm64, osx-x64 -Version $version

      # The packages are kept for a week, to try before any are published. They are compressed already.
      - name: Upload the packages
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
          retention-days: 7
          compression-level: 0

  # A new project restores WxKit from the packages, runs, and publishes with Native AOT, as an
  # application would, on each runtime's own architecture.
  test-packages:
    name: Test the packages (${{ matrix.runtime }})
    needs: pack
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: win-x64
            runner: windows-2022
          - runtime: win-arm64
            runner: windows-11-arm
          - runtime: linux-x64
            runner: ubuntu-22.04
          - runtime: linux-arm64
            runner: ubuntu-22.04-arm
          - runtime: osx-arm64
            runner: macos-15
          - runtime: osx-x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # An application needs GTK itself, but not its development files, and Native AOT needs clang
      # and zlib's, as on any Linux.
      - name: Install GTK 3, Native AOT's tools, and Xvfb
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgtk-3-0 clang zlib1g-dev xvfb

      - name: Download the packages
        uses: actions/download-artifact@v4
        with:
          name: packages
          path: artifacts/packages

      - name: Test the packages
        shell: pwsh
        run: |
          if ($IsLinux) { xvfb-run -a pwsh ./scripts/test-package.ps1 -Runtime ${{ matrix.runtime }} } else { ./scripts/test-package.ps1 -Runtime ${{ matrix.runtime }} }
          exit $LASTEXITCODE

  # Only a tag publishes, and only once every runtime's packages passed their tests. The job runs in
  # the nuget environment, where the repository's settings can require an approval first. It signs
  # in to nuget.org with Trusted Publishing, which trades the job's GitHub identity for a key that
  # lasts an hour, so no key is kept in the repository. docs/design/building-and-packaging.md
  # describes setting it up.
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test-packages, sanitizers]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: nuget
    permissions:
      contents: write
      id-token: write
    steps:
      # Only for the release notes, in docs/releases.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: docs/releases

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Download the packages
        uses: actions/download-artifact@v4
        with:
          name: packages
          path: packages

      - name: Sign in to nuget.org
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      # The native packages go first, so WxKit's dependencies are there when it is. Symbol packages
      # go with their packages. A version already published is skipped, so a failed run can run again.
      - name: Publish to nuget.org
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          for package in packages/WxKit.Native.*.nupkg packages/WxKit.[0-9]*.nupkg packages/WxKit.FSharp.*.nupkg packages/WxKit.Templates.*.nupkg; do
            dotnet nuget push "$package" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
          done

      # A release's own notes, in docs/releases/<version>.md, come before the notes generated from
      # its commits.
      - name: Create the GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          options=(--repo "$GITHUB_REPOSITORY" --title "WxKit ${TAG#v}" --generate-notes)
          if [[ "$TAG" == *-* ]]; then options+=(--prerelease); fi
          notes="docs/releases/${TAG#v}.md"
          if [[ -f "$notes" ]]; then options+=(--notes-file "$notes"); fi
          gh release create "$TAG" packages/*.nupkg "${options[@]}"
